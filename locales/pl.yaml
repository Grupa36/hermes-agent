# Katalog statycznych komunikatów Hermesa -- polski (fork Grupa36, agent "Seba")
#
# Tłumaczenie locales/en.yaml. Placeholdery {nazwa}, emoji, komendy (/stop,
# `hermes ...`), klucze konfiguracji i wartości wpisywane przez użytkownika
# zostają bez zmian. Klucze g36.* istnieją tylko w en.yaml i pl.yaml.

approval:
  # Prompt zatwierdzania w CLI -- litery o/s/a/d są parsowane na sztywno (tools/approval_prompt.py).
  dangerous_header: "⚠️  NIEBEZPIECZNA KOMENDA: {description}"
  choose_long:     "      [o] raz  |  [s] na sesję  |  [a] zawsze  |  [d] odrzuć"
  choose_short:    "      [o] raz  |  [s] na sesję  |  [d] odrzuć"
  prompt_long:     "      Wybór [o/s/a/D]: "
  prompt_short:    "      Wybór [o/s/D]: "
  choose_smart_deny: "      [o] raz  |  [d] odrzuć"
  prompt_smart_deny: "      Wybór [o/D]: "
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ Brak odpowiedzi przez {waited} — komenda nie została uruchomiona. Poproś jeszcze raz, żeby ponowić, albo podnieś limit: hermes config set approvals.timeout {suggested}"
  allowed_once:    "      ✓ Zatwierdzone jednorazowo"
  allowed_session: "      ✓ Zatwierdzone na tę sesję"
  allowed_always:  "      ✓ Dodane do stałej listy dozwolonych"
  denied:          "      ✗ Odrzucone"
  cancelled:       "      ✗ Anulowane"
  blocklist_message: "Ta komenda jest na bezwarunkowej liście zablokowanych i nie da się jej zatwierdzić."

gateway:
  # Odpowiedzi na komendy i zmiany stanu w komunikatorach.
  approval_expired: "⚠️ Zatwierdzenie wygasło (już na nie nie czekam). Poproś mnie, żebym spróbował jeszcze raz."
  draining:         "⏳ Przed restartem czekam, aż skończą aktywni agenci ({count})..."
  goal_cleared:     "✓ Cel wyczyszczony."
  no_active_goal:   "Brak aktywnego celu."
  config_read_failed: "⚠️ Nie udało się odczytać config.yaml: {error}"
  config_save_failed: "⚠️ Nie udało się zapisać konfiguracji: {error}"

  # Wynik /model -- nazwy dostawców, ID modeli i koszty zostają bez zmian.
  model:
    error_prefix:           "Błąd: {error}"
    switched:               "Przełączyłem model na `{model}`"
    provider_label:         "Dostawca: {provider}"
    context_label:          "Kontekst: {tokens} tokenów"
    max_output_label:       "Maks. odpowiedź: {tokens} tokenów"
    cost_label:             "Koszt: {cost}"
    capabilities_label:     "Możliwości: {capabilities}"
    prompt_caching_enabled: "Cache promptu: włączony"
    warning_prefix:         "Uwaga: {warning}"
    saved_global:           "Zapisane w config.yaml (`--global`)"
    session_only_hint:      "_(tylko na tę sesję — dodaj `--global`, żeby zapisać na stałe)_"
    current_label:          "Aktualnie: `{model}` u {provider}"
    current_tag:            " (aktualny)"
    more_models_suffix:     " (+{count} więcej)"
    usage_switch_model:     "`/model <name>` — zmień model"
    usage_switch_provider:  "`/model <name> --provider <slug>` — zmień dostawcę"
    usage_persist:          "`/model <name> --global` — zapisz na stałe"

  agents:
    header:                "🤖 **Aktywni agenci i zadania**"
    active_agents:         "**Aktywni agenci:** {count}"
    this_chat:             " · ten czat"
    more:                  "... i {count} więcej"
    running_processes:     "**Procesy w tle:** {count}"
    async_jobs:            "**Zadania asynchroniczne gatewaya:** {count}"
    background_delegations: "**Delegacje w tle:** {count}"
    none:                  "Brak aktywnych agentów i uruchomionych zadań."
    state_starting:        "startuje"
    state_running:         "działa"

  approve:
    no_pending:            "Nie ma komendy czekającej na zatwierdzenie."
    once_singular:         "✅ Komenda zatwierdzona. Wracam do pracy..."
    once_plural:           "✅ Komendy zatwierdzone ({count} komend). Wracam do pracy..."
    session_singular:      "✅ Komenda zatwierdzona (wzorzec zatwierdzony na tę sesję). Wracam do pracy..."
    session_plural:        "✅ Komendy zatwierdzone (wzorzec zatwierdzony na tę sesję) ({count} komend). Wracam do pracy..."
    always_singular:       "✅ Komenda zatwierdzona (wzorzec zatwierdzony na stałe). Wracam do pracy..."
    always_plural:         "✅ Komendy zatwierdzone (wzorzec zatwierdzony na stałe) ({count} komend). Wracam do pracy..."

  background:
    usage:                 "Użycie: /bg <prompt>\nPrzykład: /bg Podsumuj dzisiejsze topowe wątki z HN\n\nUruchamia prompt w osobnej sesji. Możesz dalej pisać — wynik pojawi się tutaj, gdy będzie gotowy."
    started:               "🔄 Zadanie w tle uruchomione: \"{preview}\"\nID zadania: {task_id}\nMożesz dalej pisać — wynik pojawi się, gdy będzie gotowy."

  btw:
    usage:                 "Użycie: /btw <pytanie>\nPrzykład: /btw w którym pliku był ten błąd?\n\nOdpowiadam na szybkie pytanie poboczne o tę rozmowę, nie przerywając jej. Na niezależne zadanie w tle użyj /bg <prompt>."
    no_history:            "Nie ma jeszcze rozmowy — wyślij pytanie jako zwykłą wiadomość."
    no_provider:           "❌ Nie mogę odpowiedzieć na pytanie poboczne: brak skonfigurowanych danych logowania do dostawcy."
    started:               "💬 Pytanie poboczne: \"{preview}\"\nOdpowiadam na podstawie migawki tej rozmowy — bieżąca praca trwa dalej."
    answer:                "💬 /btw: \"{preview}\"\n\n{answer}"
    failed:                "❌ /btw nie wyszło: \"{preview}\"\n{error}"

  branch:
    db_unavailable:        "Baza sesji niedostępna."
    no_conversation:       "Nie ma czego rozgałęzić — najpierw wyślij wiadomość."
    create_failed:         "Nie udało się utworzyć gałęzi: {error}"
    switch_failed:         "Gałąź utworzona, ale nie udało się na nią przełączyć."
    branched_one:          "⑂ Utworzyłem gałąź **{title}** (skopiowane wiadomości: {count})\nOryginał: `{parent}`\nGałąź: `{new}`\nWpisz `/resume`, żeby wrócić do oryginału."
    branched_many:         "⑂ Utworzyłem gałąź **{title}** (skopiowane wiadomości: {count})\nOryginał: `{parent}`\nGałąź: `{new}`\nWpisz `/resume`, żeby wrócić do oryginału."
    branched_thread_one:   "⑂ Utworzyłem gałąź **{title}** w nowym wątku (skopiowane wiadomości: {count})\nWątek: {thread}\nOryginał: `{parent}` — ten czat zostaje przy nim\nGałąź: `{new}`\nWpisz `/branch --here`, żeby rozgałęzić w tym czacie."
    branched_thread_many:  "⑂ Utworzyłem gałąź **{title}** w nowym wątku (skopiowane wiadomości: {count})\nWątek: {thread}\nOryginał: `{parent}` — ten czat zostaje przy nim\nGałąź: `{new}`\nWpisz `/branch --here`, żeby rozgałęzić w tym czacie."
    thread_fallback:       "Nie dało się tu utworzyć wątku, więc gałąź zastąpiła sesję tego czatu."

  commands:
    usage:                 "Użycie: `/commands [strona]`"
    skill_header:          "⚡ **Komendy skilli**:"
    default_desc:          "Komenda skilla"
    none:                  "Brak dostępnych komend."
    header:                "📚 **Komendy** (razem {total}, strona {page}/{total_pages})"
    nav_prev:              "`/commands {page}` ← poprzednia"
    nav_next:              "następna → `/commands {page}`"
    out_of_range:          "_(Strona {requested} jest poza zakresem, pokazuję stronę {page}.)_"

  compress:
    not_enough:            "Za krótka rozmowa, żeby ją kompresować (potrzeba co najmniej 4 wiadomości)."
    no_provider:           "Brak skonfigurowanego dostawcy -- nie mogę skompresować."
    nothing_to_do:         "Na razie nie ma czego kompresować (cały transkrypt to wciąż chroniony kontekst)."
    aggressive_unsupported: "--aggressive nie jest obsługiwane; użyj '/compress here [N]', żeby zostawić tylko ostatnie wymiany, albo /undo, żeby usunąć tury."
    focus_line:            "Fokus: \"{topic}\""
    summary_failed:        "⚠️ Nie udało się wygenerować podsumowania ({error}). Usunąłem {count} starszych wiadomości i zastąpiłem je placeholderem; wcześniejszego kontekstu nie da się już odzyskać. Sprawdź konfigurację modelu auxiliary.compression."
    aborted:               "⚠️ Kompresja przerwana ({error}). Nic nie zostało usunięte — rozmowa bez zmian. Wpisz /compress, żeby spróbować ponownie, /reset dla czystej sesji, albo sprawdź konfigurację modelu auxiliary.compression."
    aux_failed:            "ℹ️ Skonfigurowany model kompresji `{model}` zawiódł ({error}). Poradziłem sobie głównym modelem — kontekst jest nienaruszony — ale warto sprawdzić `auxiliary.compression.model` w config.yaml."
