    label_normal:          "NORMAL"
    status_fast:           "fast"
    status_normal:         "normal"
    picker_title:          "⚡ **Priority Processing**\n\nAktualny tryb: `{mode}`\n\nWybierz opcję:"
    choice_fast:           "fast — Priority Processing włączone"
    choice_normal:         "normal — standardowe przetwarzanie"
    choice_auto:           "auto — fast przez pierwsze sekundy każdej tury"
    choice_cold:           "cold — fast tylko w pierwszej turze sesji"

